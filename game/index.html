<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gloaming Archive — a stealth game of light and shadow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a18; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; box-shadow: 0 0 60px rgba(0,0,0,0.8); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Gloaming Archive: slip through the candle-lit archive, recover the lost pages and reach the exit stair unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
